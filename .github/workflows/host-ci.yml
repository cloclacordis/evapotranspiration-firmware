name: Host CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install CMake
        run: python -m pip install 'cmake>=3.31,<4'

      - name: Configure host build
        run: cmake -S evapocore -B build

      - name: Build host targets
        run: cmake --build build --parallel

      - name: Run host tests
        run: ctest --test-dir build --output-on-failure

      - name: Configure sanitizer build
        run: cmake -S evapocore -B build-sanitize -DENABLE_SANITIZERS=ON

      - name: Build sanitizer targets
        run: cmake --build build-sanitize --parallel

      - name: Run sanitizer tests
        run: ctest --test-dir build-sanitize --output-on-failure
