# Console output
CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y

# Interrupt-driven UART RX for service-console.c
CONFIG_UART_INTERRUPT_DRIVEN=y

# EvapoCore PrintReport() uses floating-point printf formats such as %.4f
CONFIG_PICOLIBC=y
CONFIG_PICOLIBC_IO_FLOAT=y

# RTC and STM32 backup registers
CONFIG_RTC=y
CONFIG_BBRAM=y

# Status LED
CONFIG_GPIO=y

# Keep SWD debugging available while Zephyr enters idle/sleep
CONFIG_STM32_ENABLE_DEBUG_SLEEP_STOP=y

# Give the main thread adequate stack for formatted reports and libc calls
CONFIG_MAIN_STACK_SIZE=2048
